<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chip8 in Rust</title>
    <style>
        body {
          background-color: #1a1a1a;
          font-family: sans-serif;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          color: #ccc;
        }
        #drop-zone { 
          border: 2px dashed #ccc; 
          padding: 10%; 
          text-align: center; 
          margin: 10%; 
        }
        #canvas { 
          display: none; 
          border: 3px solid #333;
        }
    </style>
</head>
<body>
    <div id="drop-zone">
        <input type="file" id="file-input">
    </div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <script>
        const fileInput = document.getElementById("file-input");
        const dropZone = document.getElementById("drop-zone");

        fileInput.addEventListener("change", (e) => {
             const file = e.target.files[0];
             if (!file) return;

             const reader = new FileReader();
             reader.onload = (event) => {
                 const arrayBuffer = event.target.result;
                 const uint8Array = new Uint8Array(arrayBuffer);
                 
                 startEmulator(uint8Array, file.name);
             };
             reader.readAsArrayBuffer(file);
        });
        
        function startEmulator(fileData, fileName) {
            document.getElementById("drop-zone").style.display = "none";
            document.getElementById("canvas").style.display = "block";

            var module = {
                canvas: document.getElementById("canvas"),
                arguments: [fileName],
                preRun: [() => {
                        Module.FS.writeFile(fileName, fileData);
                }],
                postRun: []
            };
            window.Module = module; 

            var script = document.createElement("script");
            script.src = "target/wasm32-unknown-emscripten/release/chip8-rust.js";
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
